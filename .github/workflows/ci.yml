name: ci

# Every PR runs the quality gates. Three tiers, from cheapest to most realistic:
#   1. offline  - unit tests + deterministic eval, no downloads, no keys (always)
#   2. models   - real bge embeddings + cross-encoder + NLI judge, no keys (always)
#   3. llm      - full system with Claude, judged by RAGAS (when ANTHROPIC_API_KEY is set)
# A tier fails the build if any metric falls below eval/thresholds.yaml or regresses
# more than `max_regression` against eval/baselines/<profile>.json.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  offline:
    name: tests + offline eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,api,loaders]"
      - name: Lint
        run: ruff check .
      - name: Unit tests (chunking, retrieval, guardrails, golden-set + prompt integrity)
        run: pytest -q
      - name: Eval gate (offline profile)
        run: askmydocs --profile offline eval
      - name: Retrieval ablation
        if: always()
        run: python scripts/ablation.py --profile offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-offline
          path: eval/reports/

  models:
    name: eval (neural retrieval, no API key)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch keeps the job small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[models,dev]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/settings.yaml') }}
      - name: Eval gate (bge + cross-encoder + NLI judge)
        run: askmydocs --profile models eval --judge nli
      - name: Retrieval ablation
        if: always()
        run: python scripts/ablation.py --profile models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-models
          path: eval/reports/

  llm:
    name: eval (Claude + RAGAS)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
               echo "ANTHROPIC_API_KEY secret not set: skipping LLM eval tier." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - if: steps.key.outputs.present == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[models,anthropic,ragas]"
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true'
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config/settings.yaml') }}
      - name: Eval gate (full system, RAGAS faithfulness)
        if: steps.key.outputs.present == 'true'
        run: askmydocs --profile default eval --judge ragas
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-llm
          path: eval/reports/
