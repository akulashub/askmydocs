# Runtime configuration. Every value can be overridden with an env var:
#   ASKMYDOCS__<SECTION>__<KEY>=value   e.g. ASKMYDOCS__RETRIEVAL__RERANK_TOP_N=6
# Profiles let you switch every model backend at once (see `profiles` below).

corpus:
  paths: ["data/corpus/fastapi"]
  include: ["**/*.md", "**/*.pdf", "**/*.html", "**/*.htm"]

chunking:
  target_tokens: 600      # aim for chunks in the 500-800 token band
  max_tokens: 800
  min_tokens: 120         # tiny trailing chunks get merged into the previous one
  overlap_tokens: 100     # carried over from the end of the previous chunk
  section_break_tokens: 450  # break at an H2 boundary only once a chunk is this full

index:
  dir: ".index"           # Chroma persistence + chunk store (git-ignored)
  collection: "fastapi_docs"

embeddings:
  backend: "sentence-transformers"     # sentence-transformers | openai | hashing
  model: "BAAI/bge-small-en-v1.5"
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 32

retrieval:
  mode: "hybrid"          # vector | bm25 | hybrid
  vector_k: 20
  bm25_k: 20
  rrf_k: 60               # Reciprocal Rank Fusion constant
  fused_k: 20             # candidates handed to the re-ranker
  rerank_top_n: 5         # chunks that reach the LLM

reranker:
  backend: "cross-encoder"             # cross-encoder | cohere | lexical | none
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  cohere_model: "rerank-english-v3.0"

generation:
  backend: "anthropic"                 # anthropic | openai | extractive
  model: "claude-sonnet-5-5"
  temperature: 0.0
  max_tokens: 700
  prompt_id: "answer_with_citations"   # key in config/prompts.yaml

guardrails:
  # Pre-generation gate: refuse without calling the LLM when the best re-ranked
  # chunk is below this relevance. Re-ranker scores are probabilities in [0, 1]
  # (cross-encoder logits are passed through a sigmoid; Cohere is already 0-1).
  min_rerank_score: 0.0
  # Post-generation: each answer sentence must carry a citation and be supported
  # by the chunk(s) it cites. If the supported fraction falls below this, refuse.
  min_supported_fraction: 0.8
  drop_unsupported_sentences: true
  support_backend: "nli"               # nli | lexical
  nli_model: "cross-encoder/nli-deberta-v3-small"
  nli_entailment_threshold: 0.5
  lexical_support_threshold: 0.55

# Named bundles of overrides. Select with --profile or ASKMYDOCS_PROFILE.
profiles:
  # Fully offline + deterministic: no model downloads, no API keys.
  # Used for unit tests and for the always-on CI eval job.
  offline:
    embeddings: { backend: "hashing", model: "hashing-v1" }
    reranker: { backend: "lexical" }
    generation: { backend: "extractive", model: "extractive-v1" }
    guardrails: { support_backend: "lexical", min_rerank_score: 0.18 }
  # Real neural retrieval (bge + cross-encoder) and NLI support checking, but no
  # LLM: generation is extractive. Needs model downloads, no API keys. CI tier 2.
  models:
    generation: { backend: "extractive", model: "extractive-v1" }
    guardrails: { min_rerank_score: 0.05 }
  # Local neural models, LLM generation via Claude.
  default:
    guardrails: { min_rerank_score: 0.05 }   # ~logit -3; calibrate with `askmydocs eval`
  openai:
    embeddings: { backend: "openai", model: "text-embedding-3-small", query_instruction: "" }
    generation: { backend: "openai", model: "gpt-4o-mini" }
    guardrails: { min_rerank_score: 0.05 }
